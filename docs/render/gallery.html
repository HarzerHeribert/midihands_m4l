<!doctype html>
<html><head><meta charset="utf-8"><title>MidiHands effects</title>
<style>
  body { margin: 0; background: #141414; color: #b5b5b5; font: 13px -apple-system, sans-serif; }
  #grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; padding: 14px; }
  figure { margin: 0; } figure canvas { width: 100%; display: block; border-radius: 4px; }
  figcaption { padding: 4px 2px; } figcaption b { color: #eee; font-weight: 600; } figcaption span { color: #777; }
  #err { color: #ff6b6b; white-space: pre-wrap; padding: 0 14px; font: 12px monospace; }
  #gl { position: absolute; left: -10000px; width: 640px; height: 360px; }
</style></head>
<body>
<pre id="err"></pre>
<div id="grid"></div>
<canvas id="gl"></canvas>
<script src="../../package/javascript/mh-gl.js"></script>
<script src="../../package/javascript/mh-fx.js"></script>
<script>
// Renders every effect (plus the hand looks) over a synthetic scene with moving
// demo hands, a few dozen frames each so feedback effects build up. Used to
// check that all shaders compile and to judge how they look.
"use strict";
const errors = [];
const OPEN = [[0, 0], [-.07, -.04], [-.13, -.09], [-.17, -.15], [-.19, -.21], [-.07, -.21], [-.085, -.31], [-.09, -.37], [-.095, -.42],
  [-.01, -.22], [-.01, -.33], [-.01, -.40], [-.01, -.45], [.05, -.205], [.06, -.30], [.065, -.36], [.07, -.41], [.10, -.18], [.12, -.25], [.13, -.29], [.14, -.33]];
function hand(wx, wy, size, mirror, open, tilt) {
  const pts = OPEN.map((p) => p.slice());
  for (let f = 1; f <= 4; f++) {
    if (open[f]) continue;
    const [mx, my] = OPEN[4 * f + 1], dx = OPEN[4 * f + 2][0] - mx;
    pts[4 * f + 2] = [mx + dx * .5, my - .05]; pts[4 * f + 3] = [mx + dx * .3, my - .025]; pts[4 * f + 4] = [mx + dx * .1, my + .025];
  }
  const c = Math.cos(tilt), s = Math.sin(tilt);
  return pts.map(([x, y]) => [wx + (x * c - y * s) * size * mirror / (16 / 9), wy + (x * s + y * c) * size]);
}
function scene() {
  const c = document.createElement("canvas"); c.width = 1280; c.height = 720;
  const g = c.getContext("2d");
  const sky = g.createLinearGradient(0, 0, 0, 720);
  sky.addColorStop(0, "#1d1b4f"); sky.addColorStop(.55, "#b8457a"); sky.addColorStop(1, "#f4a259");
  g.fillStyle = sky; g.fillRect(0, 0, 1280, 720);
  for (let i = 0; i < 40; i++) {
    const x = (i * 337) % 1280, y = (i * 211) % 420, r = 10 + (i * 17) % 50;
    const b = g.createRadialGradient(x, y, 0, x, y, r);
    b.addColorStop(0, `hsla(${(i * 47) % 360},90%,75%,.55)`); b.addColorStop(1, "hsla(0,0%,100%,0)");
    g.fillStyle = b; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  g.fillStyle = "#14102a"; g.beginPath(); g.moveTo(0, 560);
  for (let x = 0; x <= 1280; x += 40) g.lineTo(x, 520 - Math.sin(x * .01) * 40 - (x % 160 === 0 ? 70 : 0));
  g.lineTo(1280, 720); g.lineTo(0, 720); g.fill();
  g.fillStyle = "#2b2050"; g.beginPath(); g.ellipse(640, 640, 190, 230, 0, 0, 7); g.fill();
  g.fillStyle = "rgba(255,255,255,.9)"; g.font = "bold 64px -apple-system, sans-serif"; g.fillText("MIDIHANDS", 60, 120);
  const img = new Image(); img.src = c.toDataURL(); return img;
}
function frame(r, t) {
  const lo = [false, true, Math.sin(t * .9) > -.2, false, false], ro = [false, true, Math.sin(t * 1.3) > 0, false, true];
  r.setHands([{ pts: hand(.31 + Math.sin(t * .5) * .03, .97, 1.55, -1, lo, -.1), on: lo }, { pts: hand(.69, .95 + Math.cos(t * .7) * .03, 1.55, 1, ro, .08 + Math.sin(t) * .05), on: ro }]);
  r.setExpr([.5 + Math.sin(t) * .3, .3, .2 + Math.sin(t * 1.3) * .2, .1, .5, .5 + Math.cos(t * .7) * .3, .7, (Math.sin(t) + 1) / 2, .2, .55]);
  r.render(t);
}
function tile(label, sub, glCanvas) {
  const fig = document.createElement("figure"), c = document.createElement("canvas");
  c.width = 640; c.height = 360; c.getContext("2d").drawImage(glCanvas, 0, 0, 640, 360);
  fig.appendChild(c);
  const cap = document.createElement("figcaption"); cap.innerHTML = `<b>${label}</b> <span>${sub}</span>`;
  fig.appendChild(cap); document.getElementById("grid").appendChild(fig);
}
const img = scene();
img.onload = () => {
  const canvas = document.getElementById("gl");
  const r = MHGL.create(canvas);
  if (!r) { document.getElementById("err").textContent = "no WebGL2"; return; }
  r.setSource(img);
  const shoot = (label, sub, setup, frames = 30) => {
    try {
      setup();
      for (let i = 0; i < frames; i++) frame(r, 2 + i / 15);
      tile(label, sub, canvas);
    } catch (e) { errors.push(`${label}: ${e.message}`); }
  };
  shoot("Jelly hands", "look", () => { Object.assign(r.options, { look: "jelly", cues: [2, 7, 3, 5] }); r.setFx([]); }, 2);
  shoot("Line hands", "look", () => { Object.assign(r.options, { look: "lines", cues: [] }); r.setFx([]); }, 2);
  r.options.look = "jelly"; r.options.cues = [];
  for (const fx of MHFX.list) {
    shoot(fx.name, fx.group, () => r.setFx([{ id: fx.id, mix: 1, p: fx.knobs.map((k) => k.def).concat([0, 0, 0, 0, 0, 0]).slice(0, 6) }]),
      ["Feedback", "Simulation"].includes(fx.group) ? 60 : 4);
  }
  document.getElementById("err").textContent = errors.join("\n");
  document.title = errors.length ? "errors" : "ok";
};
</script>
</body></html>
